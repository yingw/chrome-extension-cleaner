# Stable release builds for macOS, Windows and Linux.
#
# Trigger: push a `v*` tag (e.g. v1.0.0). The tag MUST equal the version in
# tauri.conf.json, Cargo.toml, package.json and Cargo.lock, or the run fails
# before any build starts (see verify-version).
#
# Pipeline (least-privilege, build/read -> checksum/read -> publish/write):
#   1. verify-version  checks tag == all four package versions
#   2. build           each OS builds its bundles, uploads them as artifacts
#                      (read-only token; never touches a release)
#   3. checksums       merges the artifacts, generates SHA256SUMS
#   4. publish         the ONLY job with contents: write; creates one draft
#                      release and uploads every bundle + SHA256SUMS at once.
# Publishing is always manual: review the notes, then click Publish. A failed
# build or checksum never creates a release; if publish itself fails partway
# through, rerun the job to finish the remaining uploads (it is idempotent).
#
# No code signing / notarization by design decision: runners build natively
# per OS, never cross-built. macOS bundles are ad-hoc signed (APPLE_SIGNING_IDENTITY:
# "-") so Apple Silicon downloads are structurally valid instead of being
# reported as "damaged" — this is not a Developer ID signature and needs no
# certificate. First-run manual authorization is documented in the READMEs.
#
# For build verification on every push/PR see ci.yml.
#
# Third-party actions are pinned to full commit SHAs (not floating tags) so a
# compromised or yanked tag cannot alter what runs here. Bump them via
# Dependabot or by hand when you intend to.

name: Release

on:
  push:
    tags: ["v*"]

# Least privilege by default; only the publish job escalates to write.
permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches package versions
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' src-tauri/tauri.conf.json | head -1 | sed -E 's/.*"([^"]*)".*/\1/')
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*= *"([^"]*)".*/\1/')
          NPM=$(grep -m1 '"version"' package.json | sed -E 's/.*: *"([^"]*)".*/\1/')
          LOCK=$(awk '/^name = "chrome-extension-cleaner"/{f=1;next} f&&/^version = /{print $3; exit}' src-tauri/Cargo.lock | tr -d '"')
          echo "tag=v$TAG  tauri.conf.json=$CONF  Cargo.toml=$CARGO  package.json=$NPM  Cargo.lock=$LOCK"
          if [ "$TAG" != "$CONF" ] || [ "$TAG" != "$CARGO" ] || [ "$TAG" != "$NPM" ] || [ "$TAG" != "$LOCK" ]; then
            echo "::error::Version mismatch. Git tag v$TAG must equal all of tauri.conf.json ($CONF), Cargo.toml ($CARGO), package.json ($NPM) and Cargo.lock ($LOCK)."
            exit 1
          fi
      - name: Guard MCP out of release tree
        # The MCP test harness is dev-only and must never ship: no listener
        # bundle, no references in product frontend, and dev-mcp must stay out of default features so the plain `tauri build`
        # below can never enable it.
        run: |
          set -euo pipefail
          test ! -e src/mcp-listener.js
          ! grep -r 'MCP-LOCAL-ONLY' src/ || (echo 'MCP listener refs in src/' && exit 1)
          grep -E '^default *= *\[\]' src-tauri/Cargo.toml

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 = Apple Silicon (Sequoia). Intel DMG intentionally deferred
          # until a real machine can verify it. Pinned, not macos-latest, so a
          # runner image migration cannot silently change the architecture.
          - os: macos-15
            bundles: dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches ci.yml. Node 20 reached end-of-life 2026-04-30; 24 is the
          # current LTS (supported to 2028-04). The tag build must use the
          # same Node as the verification build.
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - name: Install Linux WebView deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - name: Build bundles
        # Build only — no release is created here (read-only token).
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bundles
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd bundles
          find . -type f -exec sha256sum {} \; | sed 's|\./||' > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256sums
          path: bundles/SHA256SUMS

  publish:
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release resolves the tag target from HEAD, so this job needs a
      # checkout even though it never compiles anything.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bundles
          merge-multiple: true
      - name: Create or update draft release with all artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="Chrome Extension Cleaner ${{ github.ref_name }}"
          NOTES="See the README for first-run steps and exactly what this tool will and will not delete."
          # Publish is re-runnable. If the draft already exists (a previous run
          # created it but failed mid-upload, or this tag was rerun), upload the
          # missing assets with --clobber instead of failing on "release already
          # exists". Build/checksum failures never reach this job, so they cannot
          # create a release in the first place.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — uploading assets (--clobber)."
            find bundles -type f -exec gh release upload "$GITHUB_REF_NAME" --clobber {} +
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "$TITLE" \
              --notes "$NOTES" \
              $(find bundles -type f | sort)
          fi
